name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # The repo is served from a subpath, so basePath and the image
          # loader both need to know about it. Change this if you move to a
          # custom domain — it should be empty there.
          NEXT_PUBLIC_BASE_PATH: /johncinematics
          # Absolute URLs for canonicals, sitemap and og:image. Change both
          # of these together if you move to a custom domain — SITE_URL loses
          # the /johncinematics suffix and BASE_PATH becomes empty.
          NEXT_PUBLIC_SITE_URL: https://johntyh.github.io/johncinematics
          # Google Analytics 4. Set only here, so local `npm run dev` sends
          # nothing and your own browsing stays out of the reports.
          NEXT_PUBLIC_GA_ID: G-JBFYW5ELMQ

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
